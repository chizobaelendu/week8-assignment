<header
  [@navContainer]
  [@stickyHeaderState]="isHeaderStuck ? 'stuck' : 'idle'"
  class="flex sticky top-0 z-50 flex-col items-start w-full bg-brand-white/80"
>
  <!-- missing upper nav -->
  <div class="w-full" @upperNavEnter><app-upper-nav [value]="20" /></div>

  <nav
    [@mobileNavState]="mobileMenuOpen ? 'open' : 'closed'"
    @mainNavEnter
    class="bg-brand-white flex w-full overflow-hidden"
  >
    <div class="logo-container-wrapper">
      <!-- missing out a navLogo -->
      <a routerLink="/">
        <app-logo logoSize="small" />
        <!-- <img src="yraBrandName.png" alt="yraBrandName" class="h-15 w-68 object-cover object-center" /> -->
      </a>
    </div>
    <ul class="flex nav-links-list" @linkRow>
      @for (link of navLinks; track link) {
        <li
          class="nav-link-item"
          [@navLink]="link.path"
          [@navLinkMobile]="mobileMenuOpen ? 'in' : 'out'"
        >
          <a
            [routerLink]="link.path"
            routerLinkActive="text-brand-teal"
            [@navLinkTapState]="linkTapState(link.path)"
            (click)="onLinkTap(link.path)"
            >{{ link.name }}</a
          >
        </li>
      }
    </ul>
    <div class="button-wrapper" @linkRow>
      <div
        class="nav-link-item"
        [@navLink]="'btn-login'"
        [@navLinkMobile]="mobileMenuOpen ? 'in' : 'out'"
      >
        <!-- missing out a button -->
        <app-button buttonBgColor="white" buttonText="Login" [buttonWidthInPx]="100" (buttonClick)="navigateTologin()" />
      </div>
      <div
        class="nav-link-item"
        [@navLink]="'btn-join'"
        [@navLinkMobile]="mobileMenuOpen ? 'in' : 'out'"
      >
        <!-- missing out a button -->
        <app-button
          buttonBgColor="orange"
          buttonText="Join Yra"
          [buttonWidthInPx]="115"
          (buttonClick)="navigateToSignup()"
        />
      </div>
    </div>
  </nav>
</header>
